[build]
  # La Guardia corre antes del build: si detecta una regresión (llave en el
  # bundle, metadatos genéricos, archivos borrados), el deploy falla y el PR
  # queda marcado en rojo — protección independiente de GitHub Actions.
  command = "node scripts/verificar-regresiones.mjs && npm run build"
  publish = "dist"
  functions = "netlify/functions"

# El chat de Aura (Orbe Central) necesita /api/ai/chat en producción, donde
# no corre server.ts (Netlify solo sirve dist/ como sitio estático). Este
# redirect debe ir ANTES del catch-all "/* -> /index.html" — Netlify usa el
# primer redirect que coincide. Los demás endpoints de /api/* (departments,
# risk-analysis, create-payment-intent) siguen requiriendo server.ts; no
# tienen función equivalente todavía.
[[redirects]]
  from = "/api/ai/chat"
  to = "/.netlify/functions/ai-chat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Assets con hash en el nombre: cachear un año (inmutables entre deploys)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=()"
