name: Guardia de regresiones

# Protege el repositorio de las regresiones que los pushes desde AI Studio
# ya introdujeron cuatro veces: llave de API en el bundle del navegador,
# metadatos genéricos, pérdida de code-splitting y borrado de archivos de
# despliegue. Referencia: docs/marco/PROTOCOLO_SEGURIDAD.md

"on":
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardia-regresiones-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guardia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar regresiones (config y archivos)
        run: node scripts/verificar-regresiones.mjs

      # `firebase-applet-config.json` está gitignorado desde el commit c6dbb03
      # (hallazgo E3 del Acta 006: la llave real no vuelve al repositorio). CI es
      # un clon limpio, así que sin este paso `tsc` y `vite build` fallan con
      # TS2307 / "Could not resolve" — la Guardia lleva roja desde el 13-08-2026.
      # No se commitea ningún archivo: se genera en el runner y se descarta.
      - name: Preparar configuración de Firebase (no se commitea)
        env:
          FIREBASE_APPLET_CONFIG: ${{ secrets.FIREBASE_APPLET_CONFIG }}
        run: |
          if [ -f firebase-applet-config.json ]; then
            echo "Config ya presente en el árbol de trabajo; no se toca."
          elif [ -n "$FIREBASE_APPLET_CONFIG" ]; then
            printf '%s' "$FIREBASE_APPLET_CONFIG" > firebase-applet-config.json
            echo "Config tomada del secreto FIREBASE_APPLET_CONFIG."
          else
            cp firebase-applet-config.example.json firebase-applet-config.json
            echo "::notice::Sin secreto FIREBASE_APPLET_CONFIG: se compila con la plantilla de ejemplo. El bundle de CI verifica regresiones, no se despliega."
          fi

      - name: Verificar tipos
        run: npm run lint

      - name: Probar integración ORBE–Context.OS
        run: npm run test:orbe-contextos

      - name: Compilar y verificar que la llave no esté en el bundle
        run: |
          npx vite build
          if grep -rl "GEMINI" dist/assets/; then
            echo "::error::La cadena GEMINI aparece en el bundle del navegador — la llave estaría expuesta."
            exit 1
          fi
          echo "Bundle limpio: la llave no viaja al cliente."
